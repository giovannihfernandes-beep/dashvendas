<style>

:root {
  --bg:       #081428;
  --surface:  #0F2545;
  --surface-2:#153057;
  --line:     #284B79;
  --text:     #F3F6FA;
  --muted:    #93A9C8;
  --gold:     #FFC607;
  --gold-soft:#3D2E05;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  padding: 40px 24px 80px;
  min-height: 100vh;
}

/* ── FUNDO DECORATIVO ── */
.bg-art { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-art svg { position: absolute; color: var(--gold); opacity: 0.05; }

/* ── LAYOUT ── */
.wrap { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }

/* ── HEADER ── */
header { margin-bottom: 36px; }
.brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.brand-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 2px var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
h1 {
  font-family: 'Fraunces', serif; font-weight: 600;
  font-size: clamp(26px, 4vw, 38px); margin: 0 0 8px;
  letter-spacing: -.01em;
}
.subtitle { color: var(--muted); font-size: 15px; max-width: 620px; line-height: 1.6; }

/* ── FILTROS ── */
.filters { display: flex; gap: 10px; margin: 28px 0 20px; flex-wrap: wrap; align-items: center; }

.search-input {
  flex: 1; min-width: 220px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--text); padding: 10px 14px; border-radius: 8px;
  font-size: 14px; font-family: 'Inter', sans-serif;
  transition: border-color .15s;
}
.search-input:focus { outline: none; border-color: var(--gold); }
.search-input::placeholder { color: var(--muted); }

.cat-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--muted); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.cat-btn:hover { color: var(--text); border-color: #3a5a8a; }
.cat-btn.active { background: var(--gold); color: #0A1730; border-color: var(--gold); font-weight: 600; }

/* ── CONTAGEM ── */
.result-count {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--muted); margin-bottom: 16px; letter-spacing: .04em;
}

/* ── GRID DE CARDS ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden;
  cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(255, 198, 7, 0.08);
}

.card-img-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; background: var(--surface-2); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.card:hover .card-img-wrap img { transform: scale(1.04); }

.no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; color: var(--muted); font-size: 13px;
}
.no-img span { font-size: 28px; opacity: .4; }

.card-cat-badge {
  position: absolute; top: 10px; left: 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: .06em; text-transform: uppercase;
  background: rgba(8, 20, 40, .75); color: var(--gold);
  border: 1px solid rgba(255,198,7,.3);
  padding: 3px 8px; border-radius: 20px;
  backdrop-filter: blur(4px);
}

.card-body { padding: 14px 16px 16px; }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.card-marca { font-size: 11px; color: var(--muted); }
.card-name { font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--text); }

/* ── EMPTY ── */
.empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
.empty-icon { font-size: 40px; display: block; margin-bottom: 12px; opacity: .4; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(4, 8, 20, .95); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; width: 100%; height: 100%;
  max-width: 100vw; max-height: 100vh;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,.6);
  animation: modalIn .2s ease;
}
@keyframes modalIn { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:none; } }

.modal-img-wrap { flex: 1; width: 100%; background: #060f1e; overflow: hidden; min-height: 0; }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.modal-img-wrap .no-img { height: 100%; }

.modal-body { padding: 22px 24px 28px; }
.modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.modal-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); }
.modal-marca { font-size: 12px; color: var(--muted); }
.modal-cat { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; margin-bottom: 10px; }
.modal-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 20px; }

.modal-actions { display: flex; gap: 10px; }
.btn-primary {
  flex: 1; padding: 12px; border-radius: 8px; border: none;
  background: var(--gold); color: #0A1730;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; transition: opacity .15s;
  text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary:hover { opacity: .85; }
.btn-secondary {
  padding: 12px 20px; border-radius: 8px;
  border: 1px solid var(--line); background: none;
  color: var(--muted); font-size: 13px; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; transition: all .15s;
}
.btn-secondary:hover { color: var(--text); border-color: #4a6080; }

/* ── CARROSSEL ── */
.carousel { position: relative; width: 100%; height: 100%; background: #060f1e; overflow: hidden; }
.carousel-track { display: flex; height: 100%; transition: transform .3s ease; }
.carousel-track img { min-width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; display: block; }
.carousel-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(8,20,40,.75); border: 1px solid var(--line);
  color: var(--text); width: 36px; height: 36px; border-radius: 50%;
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); transition: background .15s; z-index: 2;
}
.carousel-btn:hover { background: rgba(255,198,7,.2); border-color: var(--gold); }
.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }
.carousel-dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 4px; }
.carousel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; transition: background .15s; border: none; }
.carousel-dot.active { background: var(--gold); }
.carousel-dl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.carousel-dl-btns .btn-primary { font-size: 12px; padding: 10px 12px; }

/* ── FOOTER ── */
footer {
  margin-top: 60px; color: var(--muted); font-size: 12px;
  line-height: 1.6; border-top: 1px solid var(--line); padding-top: 18px;
}

/* ── RESPONSIVO ── */
@media (max-width: 600px) {
  body { padding: 24px 16px 60px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .filters { flex-direction: column; }
  .search-input { min-width: unset; width: 100%; }
  .modal-actions { flex-direction: column; }
}

// ─────────────────────────────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();

  const grid = document.getElementById("grid");
  const count = document.getElementById("resultCount");

  // Sem busca: limpa tudo
  if (!q) {
    grid.innerHTML = "";
    count.textContent = "";
    return;
  }

  const items = PRODUCTS.filter(p =>
    p.nome.toLowerCase().includes(q)
    || p.codigo.includes(q)
  );

  count.textContent = items.length
    ? `${items.length} produto${items.length > 1 ? 's' : ''} encontrado${items.length > 1 ? 's' : ''}`
    : "";

  if (!items.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <span class="empty-icon">🔍</span>
        Nenhum produto encontrado para "<strong>${q}</strong>".
      </div>`;
    return;
  }

  grid.innerHTML = items.map(p => `
    <div class="card" onclick="openModal('${p.codigo}')">
      <div class="card-img-wrap">
        ${p.imagens && p.imagens.length
          ? `<img src="${p.imagens[0]}" alt="${p.nome}" loading="lazy">`
          : `<div class="no-img"><span>📷</span>Sem foto disponível</div>`
        }
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-code">#${p.codigo}</span>
        </div>
        <div class="card-name">${p.nome}</div>
      </div>
    </div>
  `).join("");
}

// ─────────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────────
let carouselIndex = 0;
let carouselImagens = [];

function openModal(codigo) {
  const p = PRODUCTS.find(x => x.codigo === codigo);
  if (!p) return;

  document.getElementById("modalCode").textContent = "Código: " + p.codigo;
  document.getElementById("modalMarca").textContent = p.marca;
  document.getElementById("modalCat").textContent   = p.categoria;
  document.getElementById("modalName").textContent  = p.nome;

  carouselImagens = p.imagens || [];
  carouselIndex   = 0;

  const wrap    = document.getElementById("modalImgWrap");
  const actions = document.getElementById("modalActions");

  if (!carouselImagens.length) {
    wrap.innerHTML    = `<div class="no-img"><span>📷</span>Sem foto disponível</div>`;
    actions.innerHTML = `<button class="btn-secondary" onclick="closeModal()" style="padding:12px 16px;font-size:18px;">✕</button>`;
    document.getElementById("modalOverlay").classList.add("open");
    return;
  }

  const multi = carouselImagens.length > 1;

  wrap.innerHTML = `
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carouselTrack">
        ${carouselImagens.map((url, i) =>
          `<img src="${url}" alt="${p.nome} - foto ${i+1}" loading="lazy">`
        ).join("")}
      </div>
      ${multi ? `
        <button class="carousel-btn prev" onclick="slideCarousel(-1)">&#8249;</button>
        <button class="carousel-btn next" onclick="slideCarousel(1)">&#8250;</button>
      ` : ""}
    </div>
    ${multi ? `
      <div class="carousel-dots" id="carouselDots">
        ${carouselImagens.map((_, i) =>
          `<button class="carousel-dot ${i===0?'active':''}" onclick="goToSlide(${i})"></button>`
        ).join("")}
      </div>
    ` : ""}
  `;

  actions.innerHTML = `
    <div class="carousel-dl-btns">
      ${carouselImagens.map((url, i) => `
        <button class="btn-primary" onclick="downloadFoto('${url}','${p.codigo}',${i+1})">
          ⬇ ${multi ? 'Foto '+(i+1) : 'Baixar foto'}
        </button>
      `).join("")}
    </div>
    <button class="btn-secondary" onclick="closeModal()" style="padding:12px 16px;font-size:18px;line-height:1;">✕</button>
  `;

  document.getElementById("modalOverlay").classList.add("open");
}

function slideCarousel(dir) {
  carouselIndex = (carouselIndex + dir + carouselImagens.length) % carouselImagens.length;
  updateCarousel();
}

function goToSlide(i) {
  carouselIndex = i;
  updateCarousel();
}

function updateCarousel() {
  const track = document.getElementById("carouselTrack");
  if (track) track.style.transform = `translateX(-${carouselIndex * 100}%)`;
  document.querySelectorAll(".carousel-dot").forEach((d, i) =>
    d.classList.toggle("active", i === carouselIndex)
  );
}

function downloadFoto(url, codigo, num) {
  const dlUrl = url.replace("/upload/", "/upload/fl_attachment/");
  const a = document.createElement("a");
  a.href = dlUrl;
  a.download = codigo + (num > 1 ? `_foto${num}` : "") + (url.endsWith(".png") ? ".png" : ".jpg");
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

// ─────────────────────────────────────────────────────────────────────
// EVENTOS
// ─────────────────────────────────────────────────────────────────────
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

// ─────────────────────────────────────────────────────────────────────
// INIT
// (Futuramente: fetch('products.json').then(r=>r.json()).then(data => { PRODUCTS = data; init(); }))
// ─────────────────────────────────────────────────────────────────────
render();
</script>
